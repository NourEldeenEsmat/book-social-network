<app-loader-componnent></app-loader-componnent>
<ng-container *ngIf="books | async as books; else loadingTpl">
  <div *ngIf="books.body.content?.length; else emptyTpl" style="margin-top: 70px;">
    <div class="book-list gap-2 d-flex">
      <app-book-card
        (borrow)="borrowBook(book.id!)"
        [book]="book"
        [isBorrowed]="isBorrowed"
        (details)="openBookDetailsDialog(book.id!)"
        *ngFor="let book of books.body.content"
        class="book-item"
      ></app-book-card>
    </div>

    <nav
      aria-label="Page navigation"
      style="
        margin-top: 20px;
        text-align: center;
        display: flex;
        justify-content: center;
        cursor: pointer;
      "
      *ngIf="(books.body.totalPages ?? 0) > 1"
    >
      <ul class="pagination">
        <li class="page-item" [class.disabled]="page === 0" aria-current="page">
          <a class="page-link" (click)="pervPage()"
            ><i class="fas fa-backward-step"></i
          ></a>
        </li>
        <li
          class="page-item"
          *ngFor="let _ of [].constructor(books.body.totalPages ?? 0); let i = index"
        >
          <a class="page-link" [class.active]="page === i" (click)="goToPage(i)"
            >Page {{ i + 1 }}</a
          >
        </li>
        <li class="page-item" [class.disabled]="isLastPage()">
          <a class="page-link" (click)="nextPage()"
            ><i class="fas fa-forward-step"></i
          ></a>
        </li>
      </ul>
    </nav>
  </div>
</ng-container>

<ng-template #loadingTpl>
  <div class="text-center py-4">Loading books...</div>
</ng-template>

<ng-template #emptyTpl>
  <div class="text-center py-4">
    <p>No books available.</p>
    <p *ngIf="errorMessage" class="text-danger">{{ errorMessage }}</p>
  </div>
</ng-template>
